<style>
:root {
  --bg: #f3f5fa; --card: #ffffff; --text: #14161f; --muted: #474c60;
  --accent: #1d4ed8; --accent-ink: #ffffff; --border: #cfd4e2;
  --shadow: 0 1px 2px rgb(20 22 31 / 6%), 0 8px 24px rgb(20 22 31 / 8%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1017; --card: #1b1f2b; --text: #f3f4f8; --muted: #b6bacb;
    --accent: #8db4ff; --accent-ink: #0e1017; --border: #353b4d;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 35%);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.5;
}
main { width: 100%; max-width: 420px; text-align: center; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; }
.brand img { width: 36px; height: 36px; border-radius: 9px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow); padding: 28px 24px; }
.lead { color: var(--muted); margin: 0 0 14px; font-size: 0.95rem; }
.emoji { font-size: 3rem; line-height: 1; margin-bottom: 8px; }
h1 { font-size: 1.6rem; margin: 0 0 6px; overflow-wrap: anywhere; }
.date { color: var(--muted); margin: 0; }
.figure { font-size: 3.2rem; font-weight: 800; letter-spacing: -0.02em; margin: 14px 0 0; font-variant-numeric: tabular-nums; }
.unit { color: var(--muted); margin: 0 0 22px; }
.button {
  display: block; text-decoration: none; font-weight: 600; font-size: 1.05rem;
  background: var(--accent); color: var(--accent-ink); padding: 14px 18px; border-radius: 14px;
}
.button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.secondary { display: block; margin-top: 14px; color: var(--accent); font-weight: 600; text-decoration: none; }
.small { color: var(--muted); font-size: 0.85rem; margin: 20px 4px 0; }
.error h1 { font-size: 1.3rem; }
</style>
</head>

  <div class="card" id="card">
    <p class="lead">Someone shared a countdown with you</p>
    <div class="emoji" id="emoji" hidden></div>
    <h1 id="title">A countdown</h1>
    <p class="date" id="date"></p>
    <p class="figure" id="figure" hidden></p>
    <p class="unit" id="unit" hidden></p>
    <a class="button" id="add" href="widgetdown://new">Add to Widgetdown</a>
    <a class="secondary" href="https://apps.apple.com/app/id6818768673">Don't have Widgetdown? Get it on the App Store</a>
  </div>
  <p class="small">The countdown is stored in the link itself. This page doesn't send it anywhere.</p>
</main>
<script>
(function () {
  function decode(text) {
    var base64 = text.replace(/-/g, "+").replace(/_/g, "/");
    while (base64.length % 4) base64 += "=";
    var bytes = Uint8Array.from(atob(base64), function (c) { return c.charCodeAt(0); });
    var data = JSON.parse(new TextDecoder().decode(bytes));
    if (data.v === 2) return { title: data.t, emoji: data.e, date: data.d, countsUp: !!data.u, repeats: !!data.r, period: !!data.p };
    return { title: data.title, emoji: data.emoji, date: data.targetDate, countsUp: !!data.countUp, repeats: !!data.repeatRule, period: !!data.period };
  }

  var payload = location.hash.replace(/^#/, "");
  var card = document.getElementById("card");
  if (!payload) return showError();
  var countdown;
  try { countdown = decode(payload); } catch (e) { return showError(); }

  document.getElementById("add").href = "widgetdown://add?c=" + payload;
  document.title = (countdown.title || "A countdown") + " – Widgetdown";
  document.getElementById("title").textContent = countdown.title || "A countdown";
  if (countdown.emoji) {
    var emoji = document.getElementById("emoji");
    emoji.textContent = countdown.emoji;
    emoji.hidden = false;
  }
  if (countdown.period) return; // Life Progress: no single date to show.

  var target = new Date(countdown.date * 1000);
  var dateText = target.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  var startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  var targetDay = new Date(target); targetDay.setHours(0, 0, 0, 0);
  var days = Math.round((targetDay - startOfToday) / 86400000);

  if (countdown.countsUp) {
    document.getElementById("date").textContent = "Since " + dateText;
    show(Math.max(0, -days), Math.max(0, -days) === 1 ? "day since" : "days since");
  } else if (countdown.repeats && days < 0) {
    // A repeating countdown's next date is worked out in the app.
    document.getElementById("date").textContent = "Every year, or as set in the app";
  } else {
    document.getElementById("date").textContent = dateText;
    if (days > 0) show(days, days === 1 ? "day to go" : "days to go");
    else if (days === 0) show("Today", "");
  }

  function show(figure, unit) {
    var f = document.getElementById("figure"), u = document.getElementById("unit");
    f.textContent = typeof figure === "number" ? figure.toLocaleString() : figure;
    f.hidden = false;
    u.textContent = unit;
    u.hidden = !unit;
  }

  function showError() {
    card.classList.add("error");
    card.innerHTML = '<h1>This link is incomplete</h1><p class="lead">Ask the person who sent it to share the countdown again from Widgetdown.</p>' +
      '<a class="button" href="https://apps.apple.com/app/id6818768673">Get Widgetdown</a>';
  }
})();
</script>
